<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transition Playground</title>
  <style>
    :root {
      --paper: #ffffff;
      --canvas: #f0f0f0;
      --canvas-ink: #1a1a1a;
      --card-radius: 8px;
      --shadow: 0 10px 30px rgba(0,0,0,0.1);
      --display-font: Georgia, serif;
    }
    body {
      font-family: sans-serif;
      background: var(--canvas);
      color: var(--canvas-ink);
      padding: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 40px;
    }
    .playground-item {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .bookmark {
      --card-bg: var(--paper);
      position: relative;
      width: 240px;
      height: 320px;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .bm-bg-layer {
      position: absolute;
      inset: 0;
      background: var(--card-bg);
      z-index: 0;
    }
    .bm-content-layer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      box-sizing: border-box;
    }
    .bookmark-top, .bookmark-bottom {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.6;
    }
    .bookmark-bottom {
      margin-top: auto;
    }
    .title-wrap {
      margin: auto 0;
    }
    .title {
      font-family: var(--display-font);
      font-size: 24px;
      line-height: 1.1;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
    }

    /* 1. Wipe Up (Soft) */
    .anim-wipe-up.is-animating .bm-bg-layer {
      animation: wipeUpBg 700ms ease-out both;
    }
    .anim-wipe-up.is-animating .bm-content-layer {
      animation: wipeUpContent 700ms ease-out both;
    }
    @keyframes wipeUpBg {
      from { transform: scaleY(0); transform-origin: bottom; }
      to { transform: scaleY(1); transform-origin: bottom; }
    }
    @keyframes wipeUpContent {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 2. Slice Right (Bold) */
    .anim-slice.is-animating .bm-bg-layer {
      animation: sliceBg 600ms cubic-bezier(0.8, 0, 0.2, 1) both;
    }
    .anim-slice.is-animating .bm-content-layer {
      animation: sliceContent 600ms cubic-bezier(0.8, 0, 0.2, 1) both;
    }
    @keyframes sliceBg {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }
    @keyframes sliceContent {
      0% { opacity: 0; transform: translateX(-20px); clip-path: inset(0 100% 0 0); }
      50% { opacity: 1; clip-path: inset(0 0 0 0); }
      100% { opacity: 1; transform: translateX(0); clip-path: inset(0 0 0 0); }
    }

    /* 3. Bouncy Spring (Playful) */
    .anim-bounce.is-animating .bm-bg-layer {
      animation: bounceBg 700ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .anim-bounce.is-animating .bm-content-layer {
      animation: bounceContent 700ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes bounceBg {
      from { transform: scale(0); border-radius: 50%; opacity: 0; }
      to { transform: scale(1); border-radius: 0; opacity: 1; }
    }
    @keyframes bounceContent {
      0% { opacity: 0; transform: translateY(30px) scale(0.8) rotate(-5deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    }

    /* 4. 3D Blind Fold (Specialty) */
    .anim-blind.is-animating .bm-bg-layer {
      animation: blindBg 800ms cubic-bezier(0.2, 1, 0.3, 1) both;
    }
    .anim-blind.is-animating .bm-content-layer {
      animation: blindContent 800ms cubic-bezier(0.2, 1, 0.3, 1) both;
    }
    @keyframes blindBg {
      from { transform: perspective(800px) rotateX(90deg); opacity: 0; }
      to { transform: perspective(800px) rotateX(0deg); opacity: 1; }
    }
    @keyframes blindContent {
      0%, 40% { opacity: 0; transform: perspective(800px) rotateX(45deg); filter: blur(4px); }
      100% { opacity: 1; transform: perspective(800px) rotateX(0deg); filter: blur(0); }
    }

    /* 5. CRT Glitch (Dark) */
    .anim-glitch.is-animating .bm-bg-layer {
      animation: glitchBg 600ms steps(5, end) both;
    }
    .anim-glitch.is-animating .bm-content-layer {
      animation: glitchContent 600ms cubic-bezier(0.1, 1, 0.1, 1) both;
    }
    @keyframes glitchBg {
      0% { opacity: 0; filter: contrast(3) brightness(2); }
      50% { opacity: 0.5; filter: contrast(2) brightness(1.5); }
      100% { opacity: 1; filter: contrast(1) brightness(1); }
    }
    @keyframes glitchContent {
      0% { opacity: 0; letter-spacing: 0.2em; transform: scale(1.05); filter: blur(5px); }
      100% { opacity: 1; letter-spacing: inherit; transform: scale(1); filter: blur(0); }
    }

    /* 6. Iris Circle Reveal */
    .anim-iris.is-animating .bm-bg-layer {
      animation: irisBg 700ms cubic-bezier(0.7, 0, 0.3, 1) both;
    }
    .anim-iris.is-animating .bm-content-layer {
      animation: irisContent 700ms ease-out both;
    }
    @keyframes irisBg {
      from { clip-path: circle(0% at 50% 50%); }
      to { clip-path: circle(150% at 50% 50%); }
    }
    @keyframes irisContent {
      0% { opacity: 0; filter: blur(10px); transform: scale(1.1); }
      100% { opacity: 1; filter: blur(0); transform: scale(1); }
    }

    /* 7. Drop In (Heavy) */
    .anim-drop.is-animating .bm-bg-layer {
      animation: dropBg 600ms cubic-bezier(0.5, 0, 0.1, 1) both;
    }
    .anim-drop.is-animating .bm-content-layer {
      animation: dropContent 600ms cubic-bezier(0.5, 0, 0.1, 1) both;
      animation-delay: 100ms;
    }
    @keyframes dropBg {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes dropContent {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* 8. Fade & Scale (Minimal) */
    .anim-minimal.is-animating .bm-bg-layer {
      animation: minimalBg 600ms ease-out both;
    }
    .anim-minimal.is-animating .bm-content-layer {
      animation: minimalContent 600ms ease-out both;
    }
    @keyframes minimalBg {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes minimalContent {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 9. Top-Left Diagonal Wipe */
    .anim-diagonal.is-animating .bm-bg-layer {
      animation: diagonalBg 700ms cubic-bezier(0.7, 0, 0.3, 1) both;
    }
    .anim-diagonal.is-animating .bm-content-layer {
      animation: diagonalContent 700ms cubic-bezier(0.7, 0, 0.3, 1) both;
    }
    @keyframes diagonalBg {
      from { clip-path: polygon(0 0, 0 0, 0 0, 0 0); opacity: 0; }
      to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); opacity: 1; }
    }
    @keyframes diagonalContent {
      from { opacity: 0; transform: translate(-20px, -20px); }
      to { opacity: 1; transform: translate(0, 0); }
    }

    /* 10. 3D Flip */
    .anim-flip.is-animating .bm-bg-layer {
      animation: flipBg 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    .anim-flip.is-animating .bm-content-layer {
      animation: flipContent 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
      animation-delay: 100ms;
    }
    @keyframes flipBg {
      from { transform: perspective(1000px) rotateY(-90deg); opacity: 0; }
      to { transform: perspective(1000px) rotateY(0deg); opacity: 1; }
    }
    @keyframes flipContent {
      from { opacity: 0; transform: perspective(1000px) rotateY(-90deg) translateZ(50px); }
      to { opacity: 1; transform: perspective(1000px) rotateY(0deg) translateZ(0); }
    }

    /* 11. Elevator Split */
    .anim-elevator.is-animating .bm-bg-layer {
      animation: elevatorBg 600ms cubic-bezier(0.8, 0, 0.2, 1) both;
    }
    .anim-elevator.is-animating .bm-content-layer {
      animation: elevatorContent 600ms cubic-bezier(0.8, 0, 0.2, 1) both;
    }
    @keyframes elevatorBg {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes elevatorContent {
      from { transform: translateY(-50%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* 12. Cinematic Zoom Out */
    .anim-zoomout.is-animating .bm-bg-layer {
      animation: zoomoutBg 800ms cubic-bezier(0.2, 1, 0.3, 1) both;
    }
    .anim-zoomout.is-animating .bm-content-layer {
      animation: zoomoutContent 800ms cubic-bezier(0.2, 1, 0.3, 1) both;
    }
    @keyframes zoomoutBg {
      from { transform: scale(2); opacity: 0; filter: blur(10px); }
      to { transform: scale(1); opacity: 1; filter: blur(0); }
    }
    @keyframes zoomoutContent {
      from { transform: scale(1.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 13. Snap Zoom In */
    .anim-zoomin.is-animating .bm-bg-layer {
      animation: zoominBg 500ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .anim-zoomin.is-animating .bm-content-layer {
      animation: zoominContent 500ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 50ms;
    }
    @keyframes zoominBg {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes zoominContent {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 14. Swing Hinge */
    .anim-hinge.is-animating .bm-bg-layer {
      animation: hingeBg 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
      transform-origin: top left;
    }
    .anim-hinge.is-animating .bm-content-layer {
      animation: hingeContent 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
      transform-origin: top left;
    }
    @keyframes hingeBg {
      0% { transform: rotate(90deg); opacity: 0; }
      60% { transform: rotate(-5deg); opacity: 1; }
      100% { transform: rotate(0deg); opacity: 1; }
    }
    @keyframes hingeContent {
      0% { transform: rotate(90deg); opacity: 0; }
      60% { transform: rotate(-10deg); opacity: 1; }
      100% { transform: rotate(0deg); opacity: 1; }
    }

    /* 15. Center Split Wipe */
    .anim-split.is-animating .bm-bg-layer {
      animation: splitBg 700ms cubic-bezier(0.7, 0, 0.3, 1) both;
    }
    .anim-split.is-animating .bm-content-layer {
      animation: splitContent 700ms cubic-bezier(0.7, 0, 0.3, 1) both;
    }
    @keyframes splitBg {
      from { clip-path: inset(0 50% 0 50%); opacity: 0; }
      to { clip-path: inset(0 0 0 0); opacity: 1; }
    }
    @keyframes splitContent {
      0% { opacity: 0; filter: blur(8px); transform: scale(1.1); }
      100% { opacity: 1; filter: blur(0); transform: scale(1); }
    }

    /* 16. Skew Slide (Fast) */
    .anim-skew.is-animating .bm-bg-layer {
      animation: skewBg 500ms cubic-bezier(0.2, 1, 0.3, 1) both;
    }
    .anim-skew.is-animating .bm-content-layer {
      animation: skewContent 500ms cubic-bezier(0.2, 1, 0.3, 1) both;
    }
    @keyframes skewBg {
      from { transform: translateX(100%) skewX(-20deg); opacity: 0; }
      to { transform: translateX(0) skewX(0); opacity: 1; }
    }
    @keyframes skewContent {
      from { transform: translateX(-50%) skewX(10deg); opacity: 0; }
      to { transform: translateX(0) skewX(0); opacity: 1; }
    }
  </style>
</head>
<body>

<script>
  const transitions = [
    { name: "1. Wipe Up (Soft)", class: "anim-wipe-up" },
    { name: "2. Slice Right (Bold)", class: "anim-slice" },
    { name: "3. Bouncy Spring (Playful)", class: "anim-bounce" },
    { name: "4. 3D Blind Fold (Specialty)", class: "anim-blind" },
    { name: "5. CRT Glitch (Dark)", class: "anim-glitch" },
    { name: "6. Iris Circle Reveal", class: "anim-iris" },
    { name: "7. Drop In (Heavy)", class: "anim-drop" },
    { name: "8. Minimal Fade & Scale", class: "anim-minimal" },
    { name: "9. Top-Left Diagonal", class: "anim-diagonal" },
    { name: "10. 3D Flip", class: "anim-flip" },
    { name: "11. Elevator Split", class: "anim-elevator" },
    { name: "12. Cinematic Zoom Out", class: "anim-zoomout" },
    { name: "13. Snap Zoom In", class: "anim-zoomin" },
    { name: "14. Swing Hinge", class: "anim-hinge" },
    { name: "15. Center Split Wipe", class: "anim-split" },
    { name: "16. Skew Slide (Fast)", class: "anim-skew" },
  ];

  transitions.forEach(t => {
    const container = document.createElement('div');
    container.className = 'playground-item';
    
    container.innerHTML = `
      <div class="bookmark ${t.class}" id="${t.class}">
        <div class="bm-bg-layer"></div>
        <div class="bm-content-layer">
          <div class="bookmark-top">
            <span>Folder</span>
            <span>★</span>
          </div>
          <div class="title-wrap">
            <div class="title">The Art of Navigation</div>
          </div>
          <div class="bookmark-bottom">
            <span>example.com</span>
            <span>01</span>
          </div>
        </div>
      </div>
      <button onclick="playAnim('${t.class}')">Play ${t.name}</button>
    `;
    document.body.appendChild(container);
  });

  function playAnim(id) {
    const el = document.getElementById(id);
    el.classList.remove('is-animating');
    // force reflow
    void el.offsetWidth;
    el.classList.add('is-animating');
  }

  // Auto-play all on load
  setTimeout(() => {
    transitions.forEach(t => playAnim(t.class));
  }, 100);
</script>

</body>
</html>
