<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html,
    body {
      width: 380px;
      height: 560px;
      overflow: hidden;
    }

    body {
      width: 380px;
      height: 560px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      font-family: "Aptos", "Segoe UI", system-ui, sans-serif;
      background: #f4f1ea;
      color: #191713;
    }

    .popup-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .popup-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      line-height: 1.08;
      font-style: italic;
      letter-spacing: -0.02em;
      color: #191713;
    }

    .popup-count {
      padding-top: 5px;
      font-size: 10px;
      line-height: 1;
      color: rgba(25, 23, 19, 0.48);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .random-toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: max-content;
      gap: 7px;
      min-height: 26px;
      padding: 4px 8px 4px 5px;
      border: 1px solid rgba(25, 23, 19, 0.12);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.58);
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
      user-select: none;
    }

    .random-toggle:hover {
      background: #ffffff;
      border-color: rgba(25, 23, 19, 0.22);
    }

    .random-toggle:active {
      transform: scale(0.98);
    }

    .random-toggle input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .toggle-slider {
      width: 26px;
      height: 16px;
      background: #d8d2c7;
      border-radius: 999px;
      position: relative;
      transition: background 150ms ease;
    }

    .toggle-slider::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(25, 23, 19, 0.22);
      transition: transform 150ms ease;
    }

    .random-toggle input:checked + .toggle-slider {
      background: #191713;
    }

    .random-toggle input:checked + .toggle-slider::after {
      transform: translateX(10px);
    }

    .toggle-label {
      font-size: 11px;
      line-height: 1;
      color: rgba(25, 23, 19, 0.72);
      font-weight: 600;
    }

    .current-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 7px;
      background: #fffdf8;
      border: 1px solid rgba(25, 23, 19, 0.16);
      box-shadow: 0 2px 8px rgba(25, 23, 19, 0.06);
    }

    .current-kicker,
    .group-label,
    .theme-type,
    .selected-mark {
      font-size: 9px;
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 750;
    }

    .current-kicker {
      margin-bottom: 5px;
      color: rgba(25, 23, 19, 0.46);
    }

    .current-name {
      min-width: 0;
      color: #191713;
      font-size: 15px;
      line-height: 1.12;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-meta {
      margin-top: 5px;
      color: rgba(25, 23, 19, 0.58);
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-mode {
      align-self: start;
      min-width: 68px;
      padding: 6px 8px;
      border-radius: 999px;
      background: #191713;
      color: #fffdf8;
      text-align: center;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 750;
    }

    .theme-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 1px 4px 1px 1px;
    }

    .theme-list::-webkit-scrollbar { width: 4px; }
    .theme-list::-webkit-scrollbar-track { background: transparent; }
    .theme-list::-webkit-scrollbar-thumb { background: rgba(25, 23, 19, 0.22); border-radius: 999px; }

    .theme-group {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .group-label {
      grid-column: 1 / -1;
      padding: 2px 0 0;
      color: rgba(25, 23, 19, 0.48);
    }

    .theme-option {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto auto;
      gap: 7px 8px;
      min-height: 86px;
      padding: 10px 10px 9px;
      border: 1px solid rgba(25, 23, 19, 0.10);
      border-radius: 7px;
      cursor: pointer;
      transition: border-color 140ms ease, background-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
      background: rgba(255, 255, 255, 0.62);
      color: inherit;
      font: inherit;
      text-align: left;
      box-shadow: 0 1px 2px rgba(25, 23, 19, 0.05);
      overflow: hidden;
    }

    .theme-option::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: transparent;
      transition: background 140ms ease;
    }

    .theme-option:hover {
      border-color: rgba(25, 23, 19, 0.24);
      background: #fffdf8;
      transform: translateY(-1px);
      box-shadow: 0 5px 16px rgba(25, 23, 19, 0.08);
    }

    .theme-option:active {
      transform: scale(0.98);
    }

    .theme-option:focus-visible {
      outline: 2px solid #191713;
      outline-offset: 2px;
    }

    .theme-option.is-active {
      border-color: rgba(25, 23, 19, 0.82);
      background: #fffdf8;
      box-shadow: 0 0 0 1px #191713, 0 6px 18px rgba(25, 23, 19, 0.10);
    }

    .theme-option.is-active::before {
      background: #191713;
    }

    .theme-swatches {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 2px;
      min-width: 0;
    }

    .theme-swatch {
      height: 20px;
      border-radius: 2px;
      border: 1px solid rgba(25, 23, 19, 0.08);
    }

    .theme-name {
      font-size: 12px;
      font-weight: 650;
      line-height: 1.18;
      color: #191713;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      align-self: center;
      min-width: 0;
    }

    .theme-type {
      grid-column: 1 / -1;
      min-width: 0;
      color: rgba(25, 23, 19, 0.48);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theme-check {
      width: 18px;
      height: 18px;
      display: grid;
      align-items: center;
      justify-content: center;
      opacity: 0;
      border-radius: 50%;
      background: #191713;
      transition: opacity 120ms ease;
    }

    .theme-option.is-active .theme-check { opacity: 1; }

    .selected-mark {
      grid-column: 1 / -1;
      width: max-content;
      padding: 4px 6px;
      border-radius: 999px;
      color: #fffdf8;
      background: #191713;
      opacity: 0;
    }

    .theme-option.is-active .selected-mark { opacity: 1; }

    .theme-check svg {
      width: 11px;
      height: 11px;
      color: #fffdf8;
    }

    @media (max-width: 330px) {
      html,
      body { width: 320px; }
      .theme-group { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <div class="brand-wrap">
      <div class="popup-title">Wander</div>
      <label class="random-toggle" title="Random Style on New Tab">
        <input type="checkbox" id="randomToggle">
        <div class="toggle-slider"></div>
        <div class="toggle-label">Random</div>
      </label>
    </div>
    <div class="popup-count" id="themeCount"></div>
  </div>
  <div class="current-panel" id="currentPanel" aria-live="polite">
    <div>
      <div class="current-kicker">Saved style</div>
      <div class="current-name" id="currentName">Wander Classic</div>
      <div class="current-meta" id="currentMeta">Light / Classic / Slice</div>
    </div>
    <div class="current-mode" id="currentMode">Manual</div>
  </div>
  <div class="theme-list" id="themeList"></div>

  <script src="themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
