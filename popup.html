<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      max-height: 480px;
      padding: 14px;
      font-family: "Aptos", "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
    }

    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .popup-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-style: italic;
      letter-spacing: -0.02em;
      color: #1a1a1a;
    }

    .popup-count {
      font-size: 10px;
      color: #888;
      letter-spacing: 0.05em;
    }

    .random-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .random-toggle input {
      display: none;
    }

    .toggle-slider {
      width: 24px;
      height: 14px;
      background: #ddd;
      border-radius: 14px;
      position: relative;
      transition: background 150ms ease;
    }

    .toggle-slider::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      transition: transform 150ms ease;
    }

    .random-toggle input:checked + .toggle-slider {
      background: #1a1a1a;
    }

    .random-toggle input:checked + .toggle-slider::after {
      transform: translateX(10px);
    }

    .toggle-label {
      font-size: 11px;
      color: #666;
      font-weight: 500;
    }

    .theme-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .theme-list::-webkit-scrollbar { width: 4px; }
    .theme-list::-webkit-scrollbar-track { background: transparent; }
    .theme-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    .theme-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border: 1.5px solid #e8e8e8;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 120ms ease, background-color 120ms ease;
      background: #fafafa;
      flex-shrink: 0;
    }

    .theme-option:hover {
      border-color: #b0b0b0;
      background: #f0f0f0;
    }

    .theme-option.is-active {
      border-color: #1a1a1a;
      background: #f0f0f0;
      box-shadow: 0 0 0 1px #1a1a1a;
    }

    .theme-swatches {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .theme-swatch {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .theme-name {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
      color: #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theme-check {
      margin-left: auto;
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 120ms ease;
    }

    .theme-option.is-active .theme-check { opacity: 1; }

    .theme-check svg {
      width: 12px;
      height: 12px;
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <div class="brand-wrap">
      <div class="popup-title">Wander</div>
      <label class="random-toggle" title="Random Style on New Tab">
        <input type="checkbox" id="randomToggle">
        <div class="toggle-slider"></div>
        <div class="toggle-label">Random</div>
      </label>
    </div>
    <div class="popup-count" id="themeCount"></div>
  </div>
  <div class="theme-list" id="themeList"></div>

  <script src="themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
