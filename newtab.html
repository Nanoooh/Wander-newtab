<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wander</title>
  <link rel="icon" href="icons/wander-mark.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --canvas: #ffffff;
      --canvas-ink: oklch(17% 0.013 72);
      --ink-soft: oklch(35% 0.017 72 / 0.68);
      --ink-faint: oklch(40% 0.014 72 / 0.44);
      --paper: #ffffff;
      --rule: oklch(33% 0.012 72 / 0.14);
      --shadow: 0 18px 50px oklch(30% 0.014 72 / 0.10), 0 2px 8px oklch(30% 0.014 72 / 0.08);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      min-height: 100%;
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--canvas);
      color: var(--canvas-ink);
      font-family: "Aptos", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: 0.38;
      background-image:
        linear-gradient(90deg, oklch(24% 0.01 72 / 0.035) 1px, transparent 1px),
        linear-gradient(0deg, oklch(24% 0.01 72 / 0.028) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to bottom, black 0%, transparent 82%);
    }

    button, a { font: inherit; }

    .page {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(16px, 2.6vh, 30px);
      padding:
        max(26px, env(safe-area-inset-top))
        max(28px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(28px, env(safe-area-inset-left));
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      opacity: 0;
      animation: fadeLift 520ms var(--ease-out) 50ms forwards;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      color: var(--canvas-ink);
    }

    .brand-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(26px, 3vw, 44px);
      line-height: 0.86;
      letter-spacing: -0.035em;
      font-weight: 400;
      font-style: italic;
      white-space: nowrap;
    }

    .edition {
      display: grid;
      gap: 3px;
      justify-items: end;
      color: var(--ink-faint);
      font-size: 10px;
      line-height: 1.1;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .board {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      gap: clamp(8px, 1.1vw, 14px);
      perspective: 1000px;
    }

    .board.is-cutting .bookmark,
    .board.is-dealing .bookmark,
    .board.is-entering .bookmark {
      pointer-events: none;
    }

    .board.is-cutting .bookmark {
      transition:
        opacity 170ms ease,
        transform 220ms var(--ease-out),
        filter 170ms ease;
    }

    .board.is-dealing .bookmark {
      animation: cardDeal 560ms var(--ease-out) forwards;
    }

    .board.is-entering .bookmark {
      animation: cardEnter 700ms var(--ease-out) forwards;
    }

    .bookmark {
      --card-bg: var(--paper);
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      padding: clamp(14px, 1.45vw, 24px);
      border-radius: 6px;
      overflow: hidden;
      color: var(--canvas-ink);
      text-decoration: none;
      background:
        linear-gradient(135deg, oklch(100% 0 0 / 0.13), transparent 44%),
        var(--card-bg);
      box-shadow: var(--shadow);
      opacity: 1;
      transform:
        translate3d(0, 0, 0)
        rotate(var(--tilt, 0deg))
        scale(var(--scale, 1));
      transition:
        transform 240ms var(--ease-out),
        box-shadow 240ms var(--ease-out),
        filter 240ms var(--ease-out);
    }

    .bookmark::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: "";
      background:
        linear-gradient(90deg, transparent, oklch(15% 0.01 72 / 0.04), transparent),
        radial-gradient(circle at 8% 12%, oklch(100% 0 0 / 0.26), transparent 10rem);
      mix-blend-mode: multiply;
      opacity: 0.32;
    }

    .bookmark:focus-visible,
    .shuffle:focus-visible {
      outline: 2px solid oklch(21% 0.014 72);
      outline-offset: 4px;
    }

    .bookmark:active {
      transform:
        translate3d(var(--drift-x, 0), 1px, 0)
        rotate(var(--tilt, 0deg))
        scale(0.99);
    }

    .bookmark-top,
    .bookmark-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }

    .folder,
    .domain,
    .issue {
      color: color-mix(in oklch, var(--canvas-ink), var(--card-bg) 42%);
      font-size: clamp(9px, 0.78vw, 11px);
      line-height: 1.15;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .folder,
    .domain {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .site-mark {
      width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 2px;
      background: color-mix(in oklch, var(--canvas-ink), var(--card-bg) 78%);
      color: var(--card-bg);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      line-height: 1;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      opacity: 0.78;
    }

    .title {
      position: relative;
      z-index: 1;
      align-self: center;
      max-width: 100%;
      margin: clamp(12px, 2vh, 24px) 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      color: var(--canvas-ink);
      text-wrap: balance;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: var(--lines, 4);
    }

    .bookmark[data-size="hero"] .title {
      font-size: clamp(34px, 5.6vw, 92px);
      line-height: 0.9;
      letter-spacing: -0.052em;
      -webkit-line-clamp: 3;
    }

    .bookmark[data-size="wide"] .title {
      font-size: clamp(25px, 3.2vw, 58px);
      line-height: 0.95;
      letter-spacing: -0.043em;
    }

    .bookmark[data-size="tall"] .title {
      font-size: clamp(23px, 2.8vw, 48px);
      line-height: 0.98;
      letter-spacing: -0.038em;
    }

    .bookmark[data-size="small"] .title {
      font-size: clamp(18px, 2vw, 31px);
      line-height: 1.03;
      letter-spacing: -0.03em;
    }

    .bookmark[data-size="strip"] .title {
      font-size: clamp(18px, 2.35vw, 38px);
      line-height: 0.98;
      letter-spacing: -0.032em;
      -webkit-line-clamp: 2;
    }

    .spread-a .slot-0 { grid-column: 1 / 8; grid-row: 1 / 5; }
    .spread-a .slot-1 { grid-column: 8 / 13; grid-row: 1 / 4; }
    .spread-a .slot-2 { grid-column: 8 / 13; grid-row: 4 / 6; }
    .spread-a .slot-3 { grid-column: 1 / 5; grid-row: 5 / 9; }
    .spread-a .slot-4 { grid-column: 5 / 8; grid-row: 5 / 9; }
    .spread-a .slot-5 { grid-column: 8 / 13; grid-row: 6 / 9; }

    .spread-b .slot-0 { grid-column: 5 / 13; grid-row: 1 / 5; }
    .spread-b .slot-1 { grid-column: 1 / 5; grid-row: 1 / 4; }
    .spread-b .slot-2 { grid-column: 1 / 5; grid-row: 4 / 7; }
    .spread-b .slot-3 { grid-column: 5 / 9; grid-row: 5 / 9; }
    .spread-b .slot-4 { grid-column: 9 / 13; grid-row: 5 / 9; }
    .spread-b .slot-5 { grid-column: 1 / 5; grid-row: 7 / 9; }

    .spread-c .slot-0 { grid-column: 1 / 7; grid-row: 1 / 5; }
    .spread-c .slot-1 { grid-column: 7 / 13; grid-row: 1 / 3; }
    .spread-c .slot-2 { grid-column: 7 / 10; grid-row: 3 / 6; }
    .spread-c .slot-3 { grid-column: 10 / 13; grid-row: 3 / 6; }
    .spread-c .slot-4 { grid-column: 1 / 7; grid-row: 5 / 9; }
    .spread-c .slot-5 { grid-column: 7 / 13; grid-row: 6 / 9; }

    .spread-d .slot-0 { grid-column: 4 / 9; grid-row: 1 / 5; }
    .spread-d .slot-1 { grid-column: 1 / 4; grid-row: 1 / 4; }
    .spread-d .slot-2 { grid-column: 9 / 13; grid-row: 1 / 4; }
    .spread-d .slot-3 { grid-column: 1 / 4; grid-row: 4 / 9; }
    .spread-d .slot-4 { grid-column: 4 / 9; grid-row: 5 / 9; }
    .spread-d .slot-5 { grid-column: 9 / 13; grid-row: 4 / 9; }

    .slot-0 { animation-delay: 40ms; }
    .slot-1 { animation-delay: 120ms; }
    .slot-2 { animation-delay: 200ms; }
    .slot-3 { animation-delay: 280ms; }
    .slot-4 { animation-delay: 360ms; }
    .slot-5 { animation-delay: 440ms; }

    .footline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 42px;
      opacity: 0;
      animation: fadeLift 520ms var(--ease-out) 360ms forwards;
    }

    .hint {
      color: var(--ink-faint);
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .shuffle {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 40px;
      min-height: 40px;
      padding: 0 13px;
      border: 0;
      border-radius: 999px;
      background: oklch(100% 0 0 / 0.24);
      color: var(--ink-soft);
      cursor: pointer;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 10px;
      box-shadow: inset 0 0 0 1px oklch(28% 0.014 72 / 0.08);
      transition:
        color 180ms var(--ease-out),
        background-color 180ms var(--ease-out),
        transform 180ms var(--ease-out);
    }

    .shuffle svg {
      width: 14px;
      height: 14px;
      transform-origin: center;
      transition: transform 320ms var(--ease-out);
    }

    .shuffle:active {
      transform: scale(0.96);
    }

    .shuffle.is-shuffling svg {
      animation: shuffleGlyph 560ms var(--ease-out);
    }

    .shuffle.is-shuffling::after {
      position: absolute;
      inset: 7px 10px;
      border-radius: 999px;
      pointer-events: none;
      content: "";
      box-shadow:
        -10px 0 0 -7px currentColor,
        0 0 0 -7px currentColor,
        10px 0 0 -7px currentColor;
      opacity: 0;
      animation: shuffleDots 560ms var(--ease-out);
    }

    .empty {
      grid-column: 1 / -1;
      grid-row: 1 / -1;
      place-self: center;
      display: grid;
      gap: 10px;
      justify-items: center;
      text-align: center;
      color: var(--ink-soft);
      opacity: 0;
      animation: fadeLift 520ms var(--ease-out) 120ms forwards;
    }

    .empty-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 8vw, 84px);
      line-height: 0.92;
      letter-spacing: -0.05em;
      font-style: italic;
    }

    .empty-sub {
      max-width: 28rem;
      font-size: 12px;
      line-height: 1.45;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-wrap: balance;
    }

    @media (hover: hover) {
      .bookmark:hover {
        transform:
          translate3d(var(--drift-x, 0), -5px, 0)
          rotate(var(--tilt, 0deg))
          scale(var(--scale, 1));
        box-shadow: 0 24px 60px oklch(30% 0.014 72 / 0.14), 0 6px 16px oklch(30% 0.014 72 / 0.08);
        filter: saturate(1.03);
      }

      .bookmark:hover .site-mark {
        opacity: 0.92;
      }

      .shuffle:hover {
        background: oklch(100% 0 0 / 0.38);
        color: var(--canvas-ink);
      }

      .shuffle:hover svg {
        transform: translateX(3px);
      }
    }

    @media (max-width: 820px) {
      body { overflow: auto; }

      .page {
        min-height: 100vh;
        height: auto;
        padding: 22px 16px 18px;
      }

      .masthead {
        align-items: flex-start;
      }

      .brand-name {
        font-size: 34px;
      }

      .edition {
        font-size: 9px;
      }

      .board {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: none;
        gap: 10px;
      }

      .board .bookmark {
        grid-column: 1 / -1;
        grid-row: auto;
        min-height: 178px;
        transform: translateY(14px) rotate(0deg);
      }

      .bookmark[data-size="hero"],
      .bookmark[data-size="wide"],
      .bookmark[data-size="tall"],
      .bookmark[data-size="small"],
      .bookmark[data-size="strip"] {
        min-height: 178px;
      }

      .bookmark[data-size="hero"] .title,
      .bookmark[data-size="wide"] .title,
      .bookmark[data-size="tall"] .title,
      .bookmark[data-size="small"] .title,
      .bookmark[data-size="strip"] .title {
        font-size: clamp(28px, 11vw, 46px);
        line-height: 0.96;
        letter-spacing: -0.044em;
        -webkit-line-clamp: 3;
      }

      .footline {
        padding-top: 4px;
      }
    }

    @media (max-width: 520px) {
      .masthead {
        gap: 10px;
      }

      .brand {
        gap: 9px;
      }

      .brand-mark {
        width: 20px;
        height: 20px;
      }

      .brand-name {
        font-size: 30px;
      }

      .edition .edition-date {
        display: none;
      }

      .hint {
        display: none;
      }

      .footline {
        justify-content: flex-end;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }

    @keyframes fadeLift {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform:
          translate3d(var(--drift-x, 0), 14px, 0)
          rotate(var(--tilt, 0deg))
          scale(var(--scale, 1));
      }
      to {
        opacity: 1;
        transform:
          translate3d(0, 0, 0)
          rotate(var(--tilt, 0deg))
          scale(var(--scale, 1));
      }
    }

    @keyframes cardDeal {
      0% {
        opacity: 0;
        transform:
          translate3d(var(--deal-x, 0), var(--deal-y, 16px), 0)
          rotate(var(--deal-tilt, 0deg))
          scale(0.985);
        filter: blur(3px);
      }
      100% {
        opacity: 1;
        transform:
          translate3d(0, 0, 0)
          rotate(var(--tilt, 0deg))
          scale(var(--scale, 1));
        filter: blur(0);
      }
    }

    @keyframes shuffleGlyph {
      0% { transform: translateX(0) scale(1); }
      34% { transform: translateX(-5px) scale(0.88); }
      68% { transform: translateX(5px) scale(0.96); }
      100% { transform: translateX(0) scale(1); }
    }

    @keyframes shuffleDots {
      0% {
        opacity: 0;
        transform: translateX(-8px) scale(0.8);
      }
      35% {
        opacity: 0.28;
      }
      100% {
        opacity: 0;
        transform: translateX(12px) scale(1.05);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead" aria-label="Wander">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path fill="currentColor" d="M14 8h36v48L32 45 14 56V8Z"/>
          <path fill="var(--canvas)" d="M22 16h18v6H22zM22 28h11v6H22z"/>
        </svg>
        <div class="brand-name">Wander</div>
      </div>
      <div class="edition" aria-live="polite">
        <span class="edition-date" id="headerDate"></span>
        <span id="headerCount"></span>
      </div>
    </header>

    <section class="board" id="cardsGrid" aria-label="Random bookmarks"></section>

    <footer class="footline" id="footer" style="display:none">
      <div class="hint">Six saved places, loosely arranged</div>
      <button class="shuffle" id="shuffleBtn" type="button" aria-label="Shuffle bookmarks">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 5h3.2c2.8 0 3.8 10 7.1 10H17"/>
          <path d="M14.2 2.8 17 5l-2.8 2.2"/>
          <path d="M3 15h3.1c1 0 1.8-.8 2.5-2"/>
          <path d="M12.5 7.2c.3-1.2 1-2.2 2.2-2.2H17"/>
          <path d="M14.2 12.8 17 15l-2.8 2.2"/>
        </svg>
        Shuffle
      </button>
    </footer>
  </main>
  <script src="newtab.js"></script>
</body>
</html>
