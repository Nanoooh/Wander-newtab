<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wander</title>
  <link rel="icon" href="icons/wander-mark.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --canvas: #ffffff;
      --canvas-ink: oklch(17% 0.013 72);
      --ink-soft: oklch(35% 0.017 72 / 0.68);
      --ink-faint: oklch(40% 0.014 72 / 0.44);
      --paper: #ffffff;
      --rule: oklch(33% 0.012 72 / 0.14);
      --shadow: 0 18px 50px oklch(30% 0.014 72 / 0.10), 0 2px 8px oklch(30% 0.014 72 / 0.08);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --card-radius: 6px;
      --card-border: none;
      --brand-font: Georgia, "Times New Roman", serif;
      --display-font: Georgia, "Times New Roman", serif;
      --body-font: "Aptos", "Segoe UI", system-ui, sans-serif;
      --layout-1: oklch(17% 0.013 72); --bg-1: #ffffff;
      --layout-2: oklch(17% 0.013 72); --bg-2: #ffffff;
      --layout-3: oklch(17% 0.013 72); --bg-3: #ffffff;
      --layout-4: oklch(17% 0.013 72); --bg-4: #ffffff;
      --layout-5: oklch(17% 0.013 72); --bg-5: #ffffff;
      --layout-6: oklch(17% 0.013 72); --bg-6: #ffffff;
      --layout-7: oklch(17% 0.013 72); --bg-7: #ffffff;
      --layout-8: oklch(17% 0.013 72); --bg-8: #ffffff;
      --layout-9: oklch(17% 0.013 72); --bg-9: #ffffff;
      --layout-10: oklch(17% 0.013 72); --bg-10: #ffffff;
      --layout-11: oklch(17% 0.013 72); --bg-11: #ffffff;
    }

    /* Fallback font metric adjustment for blocked Google Fonts */
    @font-face { font-family: "Cormorant Garamond Fallback"; src: local("Georgia"); size-adjust: 95%; ascent-override: 98%; descent-override: 20%; line-gap-override: 0%; }
    @font-face { font-family: "Playfair Display Fallback"; src: local("Georgia"); size-adjust: 92%; ascent-override: 100%; descent-override: 22%; line-gap-override: 0%; }
    @font-face { font-family: "Space Grotesk Fallback"; src: local("system-ui"); size-adjust: 96%; }
    @font-face { font-family: "Archivo Black Fallback"; src: local("Impact"); size-adjust: 90%; }
    @font-face { font-family: "Bebas Neue Fallback"; src: local("Impact"); size-adjust: 88%; }
    @font-face { font-family: "Shrikhand Fallback"; src: local("Impact"); size-adjust: 92%; }
    @font-face { font-family: "Instrument Serif Fallback"; src: local("Georgia"); size-adjust: 96%; }
    @font-face { font-family: "Bricolage Grotesque Fallback"; src: local("system-ui"); size-adjust: 97%; }
    @font-face { font-family: "Nunito Fallback"; src: local("system-ui"); size-adjust: 103%; }
    @font-face { font-family: "Alfa Slab One Fallback"; src: local("Georgia"); size-adjust: 90%; }
    @font-face { font-family: "DM Sans Fallback"; src: local("system-ui"); size-adjust: 97%; }
    @font-face { font-family: "Jost Fallback"; src: local("system-ui"); size-adjust: 96%; }
    @font-face { font-family: "Caveat Fallback"; src: local("Segoe Script"); size-adjust: 100%; }
    @font-face { font-family: "Work Sans Fallback"; src: local("system-ui"); size-adjust: 97%; }

    html {
      min-height: 100%;
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--canvas);
      color: var(--canvas-ink);
      font-family: var(--body-font);
      overflow: hidden;
      touch-action: manipulation;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    }

    body::before { display: none; }

    .ambient-glow {
      position: fixed;
      inset: -50%;
      z-index: -1;
      pointer-events: none;
      background: 
        radial-gradient(circle at 20% 30%, var(--glow-1, transparent) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, var(--glow-2, transparent) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, var(--glow-3, transparent) 0%, transparent 50%);
      filter: blur(100px);
      opacity: 0.45;
      animation: ambientDrift 20s ease-in-out infinite alternate;
      mix-blend-mode: multiply;
    }
    
    @keyframes ambientDrift {
      0% { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(15deg) scale(1.15); }
    }

    button, a { font: inherit; }

    .page {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(16px, 2.6vh, 30px);
      padding:
        max(26px, env(safe-area-inset-top))
        max(28px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(28px, env(safe-area-inset-left));
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      opacity: 0;
      animation: fadeLift 520ms var(--ease-out) 50ms forwards;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      color: var(--canvas-ink);
    }

    .brand-name {
      font-family: var(--brand-font);
      font-size: clamp(26px, 3vw, 44px);
      line-height: 0.86;
      letter-spacing: -0.035em;
      font-weight: 400;
      font-style: italic;
      white-space: nowrap;
    }

    .edition {
      display: grid;
      gap: 3px;
      justify-items: end;
      color: var(--ink-faint);
      font-size: 10px;
      line-height: 1.1;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .board {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      gap: clamp(4px, min(1.1vw, 1vh), 14px);
      perspective: 1000px;
    }

    .board.is-cutting .bookmark,
    .board.is-dealing .bookmark,
    .board.is-entering .bookmark {
      pointer-events: none;
    }

    .board.is-cutting .bookmark {
      transition:
        opacity 170ms ease,
        transform 220ms var(--ease-out),
        filter 170ms ease;
    }

    .board.is-dealing .bookmark {
      animation: cardSweepDeal 600ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .board.is-entering .bookmark {
      animation: cardEnter 700ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .bookmark {
      --card-bg: var(--paper);
      position: relative;
      min-width: 0;
      min-height: 0;
      border-radius: var(--card-radius);
      border: var(--card-border);
      overflow: hidden;
      color: var(--canvas-ink);
      text-decoration: none;
      background: transparent;
      box-shadow: var(--shadow);
      opacity: 1;
      transform:
        translate3d(0, 0, 0)
        rotate(var(--tilt, 0deg))
        scale(var(--scale, 1));
      transition:
        transform 240ms var(--ease-out),
        box-shadow 240ms var(--ease-out),
        filter 240ms var(--ease-out);
    }

    .bookmark::after { display: none; }

    .bookmark:focus-visible,
    .shuffle:focus-visible {
      outline: 2px solid oklch(21% 0.014 72);
      outline-offset: 4px;
    }

    .bookmark:active {
      transform:
        translate3d(var(--drift-x, 0), 1px, 0)
        rotate(var(--tilt, 0deg))
        scale(0.99);
    }

    .bm-bg-layer {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, oklch(100% 0 0 / 0.13), transparent 44%),
        var(--card-bg);
      z-index: 0;
      transform-origin: center;
    }

    .bm-content-layer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      padding: clamp(8px, min(1.45vw, 1.2vh), 24px) clamp(10px, 1.45vw, 24px) clamp(10px, min(2vw, 1.5vh), 32px);
    }

    /* ---------- CORE ELEMENTS ---------- */
    .title {
      font-size: 24px; font-weight: 600; line-height: 1.25;
      max-width: 100%;
      font-family: var(--display-font);
      color: var(--canvas-ink);
      text-wrap: balance;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: var(--lines, 4);
      overflow-wrap: break-word;
      word-break: break-word;
      hyphens: auto;
      transform: scale(var(--title-scale, 1));
      transform-origin: top left;
      padding: 0.05em 0;
    }
    .folder { font-size: clamp(9px, 0.78vw, 11px); text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.6; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--canvas-ink); }
    .domain { font-size: clamp(9px, 0.78vw, 11px); opacity: 0.6; color: var(--canvas-ink); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
    .number { font-size: clamp(9px, 0.78vw, 11px); opacity: 0.6; font-variant-numeric: tabular-nums; color: var(--canvas-ink); }
    .icon { font-size: 12px; color: var(--canvas-ink); }
    
    .site-mark {
      width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 2px;
      background: color-mix(in oklch, var(--canvas-ink), var(--card-bg) 78%);
      color: var(--card-bg);
      font-family: var(--display-font);
      font-size: 12px;
      line-height: 1;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      opacity: 0.78;
    }

    /* --- 1. Classic Balanced --- */
    .l-classic .bm-content-layer { padding: clamp(8px, min(1.45vw, 1.2vh), 24px) clamp(10px, 1.45vw, 24px) clamp(10px, min(2vw, 1.5vh), 32px); }
    .l-classic .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
    .l-classic .mid { margin: auto 0; flex-grow: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; }
    .l-classic .bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; }

    .bookmark[data-size="small"] .l-classic .bm-content-layer,
    .bookmark[data-size="strip"] .l-classic .bm-content-layer {
      padding: 12px 14px 16px 14px;
    }

    /* --- 2. Minimalist Bottom --- */
    .l-minimal .bm-content-layer { padding: 32px 24px 24px 24px; justify-content: flex-end; }
    .l-minimal .folder { margin-bottom: 8px; font-weight: 600; opacity: 1; }
    .l-minimal .title { letter-spacing: -0.02em; margin-bottom: 24px; }
    .l-minimal .bottom { border-top: 1px solid color-mix(in oklch, var(--canvas-ink) 20%, transparent); padding-top: 16px; display: flex; justify-content: space-between; align-items: center;}

    /* --- 3. Heavy Header --- */
    .l-heavy-header .bm-content-layer { padding: 0; }
    .l-heavy-header .header { background: var(--canvas-ink); color: var(--card-bg); padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
    .l-heavy-header .header .folder { color: var(--card-bg); opacity: 1; font-weight: 800; font-size: 13px; }
    .l-heavy-header .header .number { color: var(--card-bg); }
    .l-heavy-header .mid { padding: 32px 24px; flex-grow: 1; min-height: 0; overflow: hidden; }
    .l-heavy-header .bottom { padding: 16px 24px; background: color-mix(in oklch, var(--canvas-ink) 5%, transparent); border-top: 1px solid color-mix(in oklch, var(--canvas-ink) 10%, transparent); display: flex; justify-content: space-between; }

    /* --- 4. Magazine Split --- */
    .l-magazine .bm-content-layer { padding: 0; }
    .l-magazine .top-half { height: 38%; background: color-mix(in oklch, var(--canvas-ink) 8%, transparent); position: relative; }
    .l-magazine .top-half .number { position: absolute; top: 16px; right: 16px; font-size: clamp(34px, 4vw, 48px); font-family: 'Playfair Display', serif; opacity: 0.2; }
    .l-magazine .bottom-half { padding: clamp(12px, 1.45vw, 24px); display: flex; flex-direction: column; height: 62%; min-height: 0; overflow: hidden; box-sizing: border-box; }
    .l-magazine .title { font-family: 'Playfair Display', serif; font-weight: 600; line-height: 1.2; }
    .bookmark.l-magazine[data-size="hero"] .title { -webkit-line-clamp: 2; }
    .bookmark.l-magazine[data-size="wide"] .title { -webkit-line-clamp: 2; }
    .bookmark.l-magazine[data-size="tall"] .title { -webkit-line-clamp: 3; }
    .bookmark.l-magazine[data-size="small"] .title { -webkit-line-clamp: 2; }
    .bookmark.l-magazine[data-size="strip"] .title { -webkit-line-clamp: 2; }
    .l-magazine .folder { margin-top: auto; opacity: 1; font-weight: 600; }

    .bookmark[data-size="small"] .l-magazine .top-half,
    .bookmark[data-size="strip"] .l-magazine .top-half { height: 25%; }
    .bookmark[data-size="small"] .l-magazine .top-half .number,
    .bookmark[data-size="strip"] .l-magazine .top-half .number { top: 8px; right: 10px; font-size: 24px; }
    .bookmark[data-size="small"] .l-magazine .bottom-half,
    .bookmark[data-size="strip"] .l-magazine .bottom-half { height: 75%; padding: clamp(10px, 1vw, 16px); }

    /* --- 5. Brutalist Borders --- */
    .l-brutalist .bm-content-layer { padding: 24px; gap: 16px; }
    .l-brutalist .mid { flex-grow: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; }
    .l-brutalist .title { font-weight: 800; text-transform: uppercase; padding: 0; }
    .bookmark.l-brutalist[data-size="tall"] .title { -webkit-line-clamp: 3; }
    .bookmark.l-brutalist[data-size="small"] .title { -webkit-line-clamp: 3; }
    .bookmark.l-brutalist[data-size="strip"] .title { -webkit-line-clamp: 2; }
    .l-brutalist .top, .l-brutalist .bottom { display: flex; justify-content: space-between; font-weight: 600; }

    /* --- 8. Grid Bento --- */
    .l-bento .bm-content-layer { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: 12px; }
    .l-bento .cell { background: color-mix(in oklch, var(--canvas-ink) 5%, transparent); border-radius: 8px; padding: 16px; display: flex; align-items: center; }
    .l-bento .c-folder { grid-column: 1; }
    .l-bento .c-number { grid-column: 2; justify-content: flex-end; font-size: 24px; font-weight: 800; opacity: 0.2; }
    .l-bento .c-title { grid-column: 1 / -1; align-items: flex-start; flex-direction: column; justify-content: center; background: var(--canvas-ink); color: var(--card-bg); }
    .l-bento .c-title .title { color: var(--card-bg); }
    .l-bento .c-title .domain { color: var(--card-bg); margin-top: auto; opacity: 0.6; }

    .bookmark[data-size="small"] .l-bento .bm-content-layer,
    .bookmark[data-size="strip"] .l-bento .bm-content-layer { padding: 8px; gap: 6px; }
    .bookmark[data-size="small"] .l-bento .cell,
    .bookmark[data-size="strip"] .l-bento .cell { padding: 10px; border-radius: 4px; }
    .bookmark[data-size="small"] .l-bento .c-number,
    .bookmark[data-size="strip"] .l-bento .c-number { font-size: 16px; }

    /* --- 9. Typographic Poster --- */
    .l-poster .bm-content-layer { padding: 24px; }
    .l-poster .title { font-family: 'Bebas Neue', "PingFang SC", "Microsoft YaHei", sans-serif; font-size: clamp(38px, 6vw, 64px); line-height: 1.05; text-transform: uppercase; word-break: break-all; padding: 0.1em 0; }
    .l-poster .meta { position: absolute; right: 16px; bottom: 24px; writing-mode: vertical-rl; display: flex; gap: 16px; }

    .bookmark[data-size="small"] .l-poster .title,
    .bookmark[data-size="strip"] .l-poster .title { font-size: clamp(24px, 4vw, 36px); line-height: 1.1; }
    .bookmark[data-size="small"] .l-poster .meta,
    .bookmark[data-size="strip"] .l-poster .meta { right: 8px; bottom: 12px; gap: 8px; }

    /* --- 11. Floating Badge --- */
    .l-badge .bm-content-layer { padding: 32px 24px; justify-content: flex-end; }
    .l-badge .badge { position: absolute; top: 16px; right: 16px; width: 48px; height: 48px; border-radius: 50%; background: var(--canvas-ink); color: var(--card-bg); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
    .l-badge .folder { font-weight: 800; opacity: 1; margin-bottom: 12px; }

    /* --- 12. Console Terminal --- */
    .l-terminal .bm-content-layer { padding: 24px; font-family: 'Space Mono', monospace; border-radius: 0; }
    .l-terminal .folder { opacity: 1; text-transform: none; letter-spacing: 0; margin-bottom: 16px; }
    .l-terminal .folder::before { content: "root@wander:~# cd "; opacity: 0.6; }
    .l-terminal .title { font-family: 'Space Mono', monospace; font-weight: 400; margin-bottom: clamp(8px, 1vw, 24px); line-height: 1.4; font-size: clamp(14px, 2vw, 18px); }
    .bookmark.l-terminal[data-size="tall"] .title { -webkit-line-clamp: 4; }
    .bookmark.l-terminal[data-size="small"] .title { -webkit-line-clamp: 3; }
    .bookmark.l-terminal[data-size="strip"] .title { -webkit-line-clamp: 2; }
    .l-terminal .title::before { content: "> "; opacity: 0.6; }
    .l-terminal .domain { opacity: 0.5; }
    .l-terminal .domain::before { content: "[LINK] "; }

    /* --- 13. Index Card --- */
    .l-index .bm-content-layer { padding: 18px 24px; background-image: repeating-linear-gradient(transparent, transparent 27px, color-mix(in oklch, var(--canvas-ink) 15%, transparent) 28px); border-radius: 2px; }
    .l-index .folder { font-family: 'Space Mono', monospace; margin-bottom: 24px; opacity: 1; display: inline-block; line-height: 1; }
    .l-index .title { font-family: 'Caveat', "Kaiti SC", "STKaiti", cursive, serif; font-size: clamp(32px, 4vw, 42px); font-weight: 600; line-height: 1.35; padding: 0.1em 0; }
    .l-index .bottom { margin-top: auto; font-family: 'Space Mono', monospace; font-size: 10px; opacity: 0.4; }

    .bookmark[data-size="small"] .l-index .title,
    .bookmark[data-size="strip"] .l-index .title { font-size: clamp(18px, 2.5vw, 24px); line-height: 1.3; }
    .bookmark[data-size="small"] .l-index .folder,
    .bookmark[data-size="strip"] .l-index .folder { margin-bottom: 12px; }

    /* --- 14. Diagonal Split --- */
    .l-diagonal .bm-content-layer { padding: 0; }
    .l-diagonal .top-poly { height: 40%; background: var(--canvas-ink); color: var(--card-bg); padding: clamp(14px, 1.45vw, 24px); clip-path: polygon(0 0, 100% 0, 100% 70%, 0 100%); }
    .l-diagonal .title { font-weight: 800; }
    .bookmark.l-diagonal[data-size="hero"] .title { -webkit-line-clamp: 3; }
    .bookmark.l-diagonal[data-size="wide"] .title { -webkit-line-clamp: 3; }
    .bookmark.l-diagonal[data-size="tall"] .title { -webkit-line-clamp: 3; }
    .bookmark.l-diagonal[data-size="small"] .title { -webkit-line-clamp: 2; }
    .bookmark.l-diagonal[data-size="strip"] .title { -webkit-line-clamp: 2; }
    .l-diagonal .top-poly .number { color: var(--card-bg); }
    .l-diagonal .bottom-poly { padding: clamp(14px, 1.45vw, 24px); display: flex; flex-direction: column; justify-content: flex-end; flex-grow: 1; min-height: 0; overflow: hidden; }

    /* Removed Swiss Grid */

    /* Override sizing constraints for certain layouts */
    .bookmark[data-size="hero"] .title:not(.l-poster .title, .l-index .title) {
      font-size: clamp(34px, 5.6vw, 84px);
      line-height: 1.15;
      letter-spacing: -0.052em;
      -webkit-line-clamp: 3;
    }

    .bookmark[data-size="wide"] .title {
      font-size: clamp(25px, 3.2vw, 54px);
      line-height: 1.2;
      letter-spacing: -0.043em;
    }

    .bookmark[data-size="tall"] .title {
      font-size: clamp(23px, 2.8vw, 46px);
      line-height: 1.2;
      letter-spacing: -0.038em;
    }

    .bookmark[data-size="small"] .title {
      font-size: clamp(14px, 1.8vw, 24px);
      line-height: 1.25;
      letter-spacing: -0.03em;
      -webkit-line-clamp: 4;
    }

    .bookmark[data-size="strip"] .title {
      font-size: clamp(14px, 2vw, 28px);
      line-height: 1.1;
      letter-spacing: -0.032em;
      -webkit-line-clamp: 2;
    }

    /* Spread layouts */
    .spread-a .slot-0 { grid-column: 1 / 8; grid-row: 1 / 5; }
    .spread-a .slot-1 { grid-column: 8 / 13; grid-row: 1 / 4; }
    .spread-a .slot-2 { grid-column: 8 / 13; grid-row: 4 / 6; }
    .spread-a .slot-3 { grid-column: 1 / 5; grid-row: 5 / 9; }
    .spread-a .slot-4 { grid-column: 5 / 8; grid-row: 5 / 9; }
    .spread-a .slot-5 { grid-column: 8 / 13; grid-row: 6 / 9; }

    .spread-b .slot-0 { grid-column: 5 / 13; grid-row: 1 / 5; }
    .spread-b .slot-1 { grid-column: 1 / 5; grid-row: 1 / 4; }
    .spread-b .slot-2 { grid-column: 1 / 5; grid-row: 4 / 7; }
    .spread-b .slot-3 { grid-column: 5 / 9; grid-row: 5 / 9; }
    .spread-b .slot-4 { grid-column: 9 / 13; grid-row: 5 / 9; }
    .spread-b .slot-5 { grid-column: 1 / 5; grid-row: 7 / 9; }

    .spread-c .slot-0 { grid-column: 1 / 7; grid-row: 1 / 5; }
    .spread-c .slot-1 { grid-column: 7 / 13; grid-row: 1 / 3; }

    .slot-0, .slot-0 .bm-bg-layer, .slot-0 .bm-content-layer { animation-delay: 40ms; }
    .slot-1, .slot-1 .bm-bg-layer, .slot-1 .bm-content-layer { animation-delay: 120ms; }
    .slot-2, .slot-2 .bm-bg-layer, .slot-2 .bm-content-layer { animation-delay: 200ms; }
    .slot-3, .slot-3 .bm-bg-layer, .slot-3 .bm-content-layer { animation-delay: 280ms; }
    .slot-4, .slot-4 .bm-bg-layer, .slot-4 .bm-content-layer { animation-delay: 360ms; }

    .footline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 42px;
      opacity: 0;
      animation: fadeLift 520ms var(--ease-out) 360ms forwards;
    }

    .hint {
      color: var(--ink-faint);
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .shuffle {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 40px;
      min-height: 40px;
      padding: 0 13px;
      border: 0;
      border-radius: 999px;
      background: oklch(100% 0 0 / 0.24);
      color: var(--ink-soft);
      cursor: pointer;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 10px;
      box-shadow: inset 0 0 0 1px oklch(28% 0.014 72 / 0.08);
      transition:
        color 180ms var(--ease-out),
        background-color 180ms var(--ease-out),
        transform 180ms var(--ease-out);
      overflow: hidden;
    }

    .shuffle svg {
      width: 14px;
      height: 14px;
      transform-origin: center;
      transition: transform 320ms var(--ease-out);
    }

    .shuffle:active {
      transform: scale(0.96);
    }

    .shuffle-text {
      display: inline-flex;
    }
    
    .shuffle.is-shuffling {
      animation: buttonSweep 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .shuffle.is-shuffling .shuffle-svg {
      animation: spinSweep 600ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 1. SOFT -> ZOOMOUT */
    html[data-theme-type="zoomout"] .board.is-dealing .bookmark .bm-bg-layer,
    html[data-theme-type="zoomout"] .board.is-entering .bookmark .bm-bg-layer {
      animation: zoomoutBg 800ms cubic-bezier(0.2, 1, 0.3, 1) both;
    }
    html[data-theme-type="zoomout"] .board.is-dealing .bookmark .bm-content-layer,
    html[data-theme-type="zoomout"] .board.is-entering .bookmark .bm-content-layer {
      animation: zoomoutContent 800ms cubic-bezier(0.2, 1, 0.3, 1) both;
    }
    @keyframes zoomoutBg {
      from { transform: scale(2); opacity: 0; filter: blur(10px); }
      to { transform: scale(1); opacity: 1; filter: blur(0); }
    }
    @keyframes zoomoutContent {
      from { transform: scale(1.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 2. BOLD -> SLICE (Directional) */
    html[data-theme-type="slice"] .board.is-dealing .bookmark[data-slice-dir="left"] .bm-bg-layer,
    html[data-theme-type="slice"] .board.is-entering .bookmark[data-slice-dir="left"] .bm-bg-layer { animation: sliceLeftBg 600ms cubic-bezier(0.8, 0, 0.2, 1) both; }
    html[data-theme-type="slice"] .board.is-dealing .bookmark[data-slice-dir="left"] .bm-content-layer,
    html[data-theme-type="slice"] .board.is-entering .bookmark[data-slice-dir="left"] .bm-content-layer { animation: sliceLeftContent 600ms cubic-bezier(0.8, 0, 0.2, 1) both; }

    html[data-theme-type="slice"] .board.is-dealing .bookmark[data-slice-dir="right"] .bm-bg-layer,
    html[data-theme-type="slice"] .board.is-entering .bookmark[data-slice-dir="right"] .bm-bg-layer { animation: sliceRightBg 600ms cubic-bezier(0.8, 0, 0.2, 1) both; }
    html[data-theme-type="slice"] .board.is-dealing .bookmark[data-slice-dir="right"] .bm-content-layer,
    html[data-theme-type="slice"] .board.is-entering .bookmark[data-slice-dir="right"] .bm-content-layer { animation: sliceRightContent 600ms cubic-bezier(0.8, 0, 0.2, 1) both; }

    html[data-theme-type="slice"] .board.is-dealing .bookmark[data-slice-dir="top"] .bm-bg-layer,
    html[data-theme-type="slice"] .board.is-entering .bookmark[data-slice-dir="top"] .bm-bg-layer { animation: sliceTopBg 600ms cubic-bezier(0.8, 0, 0.2, 1) both; }
    html[data-theme-type="slice"] .board.is-dealing .bookmark[data-slice-dir="top"] .bm-content-layer,
    html[data-theme-type="slice"] .board.is-entering .bookmark[data-slice-dir="top"] .bm-content-layer { animation: sliceTopContent 600ms cubic-bezier(0.8, 0, 0.2, 1) both; }

    html[data-theme-type="slice"] .board.is-dealing .bookmark[data-slice-dir="bottom"] .bm-bg-layer,
    html[data-theme-type="slice"] .board.is-entering .bookmark[data-slice-dir="bottom"] .bm-bg-layer { animation: sliceBottomBg 600ms cubic-bezier(0.8, 0, 0.2, 1) both; }
    html[data-theme-type="slice"] .board.is-dealing .bookmark[data-slice-dir="bottom"] .bm-content-layer,
    html[data-theme-type="slice"] .board.is-entering .bookmark[data-slice-dir="bottom"] .bm-content-layer { animation: sliceBottomContent 600ms cubic-bezier(0.8, 0, 0.2, 1) both; }

    @keyframes sliceLeftBg { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes sliceLeftContent { 0% { opacity: 0; transform: translateX(-20px); clip-path: inset(0 100% 0 0); } 50% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 1; transform: translateX(0); clip-path: inset(0 0 0 0); } }
    @keyframes sliceRightBg { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }
    @keyframes sliceRightContent { 0% { opacity: 0; transform: translateX(20px); clip-path: inset(0 0 0 100%); } 50% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 1; transform: translateX(0); clip-path: inset(0 0 0 0); } }
    @keyframes sliceTopBg { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes sliceTopContent { 0% { opacity: 0; transform: translateY(-20px); clip-path: inset(0 0 100% 0); } 50% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 1; transform: translateY(0); clip-path: inset(0 0 0 0); } }
    @keyframes sliceBottomBg { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes sliceBottomContent { 0% { opacity: 0; transform: translateY(20px); clip-path: inset(100% 0 0 0); } 50% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 1; transform: translateY(0); clip-path: inset(0 0 0 0); } }

    /* 3. PLAYFUL -> FLIP */
    html[data-theme-type="flip"] .board.is-dealing .bookmark .bm-bg-layer,
    html[data-theme-type="flip"] .board.is-entering .bookmark .bm-bg-layer {
      animation: flipBg 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    html[data-theme-type="flip"] .board.is-dealing .bookmark .bm-content-layer,
    html[data-theme-type="flip"] .board.is-entering .bookmark .bm-content-layer {
      animation: flipContent 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
      animation-delay: 100ms; /* Offset content flip */
    }
    @keyframes flipBg {
      from { transform: perspective(1000px) rotateY(-90deg); opacity: 0; }
      to { transform: perspective(1000px) rotateY(0deg); opacity: 1; }
    }
    @keyframes flipContent {
      from { opacity: 0; transform: perspective(1000px) rotateY(-90deg) translateZ(50px); }
      to { opacity: 1; transform: perspective(1000px) rotateY(0deg) translateZ(0); }
    }

    /* 4. SPECIALTY -> BLIND */
    html[data-theme-type="blind"] .board.is-dealing .bookmark .bm-bg-layer,
    html[data-theme-type="blind"] .board.is-entering .bookmark .bm-bg-layer {
      animation: blindBg 800ms cubic-bezier(0.2, 1, 0.3, 1) both;
    }
    html[data-theme-type="blind"] .board.is-dealing .bookmark .bm-content-layer,
    html[data-theme-type="blind"] .board.is-entering .bookmark .bm-content-layer {
      animation: blindContent 800ms cubic-bezier(0.2, 1, 0.3, 1) both;
    }
    @keyframes blindBg {
      from { transform: perspective(800px) rotateX(90deg); opacity: 0; }
      to { transform: perspective(800px) rotateX(0deg); opacity: 1; }
    }
    @keyframes blindContent {
      0%, 40% { opacity: 0; transform: perspective(800px) rotateX(45deg); filter: blur(4px); }
      100% { opacity: 1; transform: perspective(800px) rotateX(0deg); filter: blur(0); }
    }

    /* 5. DARK -> IRIS */
    html[data-theme-type="iris"] .board.is-dealing .bookmark .bm-bg-layer,
    html[data-theme-type="iris"] .board.is-entering .bookmark .bm-bg-layer {
      animation: irisBg 700ms cubic-bezier(0.7, 0, 0.3, 1) both;
    }
    html[data-theme-type="iris"] .board.is-dealing .bookmark .bm-content-layer,
    html[data-theme-type="iris"] .board.is-entering .bookmark .bm-content-layer {
      animation: irisContent 700ms ease-out both;
    }
    @keyframes irisBg {
      from { clip-path: circle(0% at 50% 50%); }
      to { clip-path: circle(150% at 50% 50%); }
    }
    @keyframes irisContent {
      0% { opacity: 0; filter: blur(10px); transform: scale(1.1); }
      100% { opacity: 1; filter: blur(0); transform: scale(1); }
    }

    /* 6. PLAYFUL-ALT -> HINGE */
    html[data-theme-type="hinge"] .board.is-dealing .bookmark .bm-bg-layer,
    html[data-theme-type="hinge"] .board.is-entering .bookmark .bm-bg-layer {
      animation: hingeBg 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
      transform-origin: top left;
    }
    html[data-theme-type="hinge"] .board.is-dealing .bookmark .bm-content-layer,
    html[data-theme-type="hinge"] .board.is-entering .bookmark .bm-content-layer {
      animation: hingeContent 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
      transform-origin: top left;
    }
    @keyframes hingeBg {
      0% { transform: rotate(90deg); opacity: 0; }
      60% { transform: rotate(-5deg); opacity: 1; }
      100% { transform: rotate(0deg); opacity: 1; }
    }
    @keyframes hingeContent {
      0% { transform: rotate(90deg); opacity: 0; }
      60% { transform: rotate(-10deg); opacity: 1; }
      100% { transform: rotate(0deg); opacity: 1; }
    }

    /* 7. MIXED -> ELEVATOR */
    html[data-theme-type="elevator"] .board.is-dealing .bookmark .bm-bg-layer,
    html[data-theme-type="elevator"] .board.is-entering .bookmark .bm-bg-layer {
      animation: elevatorBg 600ms cubic-bezier(0.8, 0, 0.2, 1) both;
    }
    html[data-theme-type="elevator"] .board.is-dealing .bookmark .bm-content-layer,
    html[data-theme-type="elevator"] .board.is-entering .bookmark .bm-content-layer {
      animation: elevatorContent 600ms cubic-bezier(0.8, 0, 0.2, 1) both;
    }
    @keyframes elevatorBg {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes elevatorContent {
      from { transform: translateY(-50%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* 8. MIXED-ALT -> SPLIT */
    html[data-theme-type="split"] .board.is-dealing .bookmark .bm-bg-layer,
    html[data-theme-type="split"] .board.is-entering .bookmark .bm-bg-layer {
      animation: splitBg 700ms cubic-bezier(0.7, 0, 0.3, 1) both;
    }
    html[data-theme-type="split"] .board.is-dealing .bookmark .bm-content-layer,
    html[data-theme-type="split"] .board.is-entering .bookmark .bm-content-layer {
      animation: splitContent 700ms cubic-bezier(0.7, 0, 0.3, 1) both;
    }
    @keyframes splitBg {
      from { clip-path: inset(0 50% 0 50%); opacity: 0; }
      to { clip-path: inset(0 0 0 0); opacity: 1; }
    }
    @keyframes splitContent {
      0% { opacity: 0; filter: blur(8px); transform: scale(1.1); }
      100% { opacity: 1; filter: blur(0); transform: scale(1); }
    }



    .empty {
      grid-column: 1 / -1;
      grid-row: 1 / -1;
      place-self: center;
      display: grid;
      gap: 10px;
      justify-items: center;
      text-align: center;
      color: var(--ink-soft);
      opacity: 0;
      animation: fadeLift 520ms var(--ease-out) 120ms forwards;
    }

    .empty-title {
      font-family: var(--display-font);
      font-size: clamp(34px, 8vw, 84px);
      line-height: 0.92;
      letter-spacing: -0.05em;
      font-style: italic;
    }

    .empty-sub {
      max-width: 28rem;
      font-size: 12px;
      line-height: 1.45;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-wrap: balance;
    }

    /* ===== Dark card contrast fix ===== */

    .bookmark.is-dark-card {
      color: #F5F0E8;
    }

    .bookmark.is-dark-card .folder,
    .bookmark.is-dark-card .domain,
    .bookmark.is-dark-card .issue {
      color: rgba(245, 240, 232, 0.55);
    }

    /* Heavy-header layout: folder is on colored header, not on card bg */
    .bookmark.is-dark-card.l-heavy-header .header .folder {
      color: var(--card-bg);
      opacity: 1;
    }
    .bookmark.is-dark-card.l-heavy-header .header .number {
      color: var(--card-bg);
    }

    .bookmark.is-dark-card .title {
      color: #F5F0E8;
    }

    .bookmark.is-dark-card .site-mark {
      background: #F5F0E8;
      color: var(--card-bg);
    }

    .bookmark.is-light-card {
      color: #1A1A1A;
    }

    .bookmark.is-light-card .folder,
    .bookmark.is-light-card .domain,
    .bookmark.is-light-card .issue {
      color: rgba(26, 26, 26, 0.55);
    }

    .bookmark.is-light-card .title {
      color: #1A1A1A;
    }

    .bookmark.is-light-card .site-mark {
      background: #1A1A1A;
      color: var(--card-bg);
    }

    /* ===== Theme-type overrides ===== */

    /* Bold type: offset shadow, uppercase, hard edges */
    [data-theme-type="bold"] .bookmark { background: var(--card-bg); }
    [data-theme-type="bold"] .brand-name { font-style: normal; text-transform: uppercase; letter-spacing: 0.02em; }
    [data-theme-type="bold"] .title { font-weight: 700; text-transform: uppercase; letter-spacing: -0.02em; }
    [data-theme-type="bold"] .site-mark { border-radius: 0; }
    [data-theme-type="bold"] .shuffle { border-radius: 0; }

    /* Playful type: rounded, colorful, soft shadows */
    [data-theme-type="playful"] .bookmark { background: var(--card-bg); }

    /* Specialty type: custom per-theme handled via CSS vars */
    [data-theme-type="specialty"] .bookmark { background: var(--card-bg); }

    /* Dark type: dark canvas, light text, glow effects */
    [data-theme-type="dark"] .bookmark { background: var(--card-bg); }
    [data-theme-type="dark"] .brand-name { font-style: normal; text-transform: uppercase; letter-spacing: 0.04em; }
    [data-theme-type="dark"] .site-mark { border-radius: 0; }

    /* Mixed type: dark canvas with accent cards */
    [data-theme-type="mixed"] .bookmark { background: var(--card-bg); }
    [data-theme-type="mixed"] .site-mark { border-radius: 0; }

    /* ===== Hover states ===== */
    @media (hover: hover) {
      .bookmark:hover {
        transform:
          translate3d(var(--drift-x, 0), -5px, 0)
          rotate(var(--tilt, 0deg))
          scale(var(--scale, 1));
        filter: saturate(1.03);
      }

      .bookmark:hover .site-mark { opacity: 0.92; }

      .shuffle:hover { color: var(--canvas-ink); }
      .shuffle:hover svg { transform: translateX(3px); }

      /* Soft hover */
      [data-theme-type="soft"] .bookmark:hover,
      [data-theme-type="classic"] .bookmark:hover {
        box-shadow: 0 24px 60px oklch(30% 0.014 72 / 0.14), 0 6px 16px oklch(30% 0.014 72 / 0.08);
      }
      [data-theme-type="soft"] .shuffle:hover,
      [data-theme-type="classic"] .shuffle:hover {
        background: oklch(100% 0 0 / 0.38);
      }

      /* Bold hover */
      [data-theme-type="bold"] .bookmark:hover {
        transform: translate3d(-2px, -2px, 0) rotate(var(--tilt, 0deg)) scale(var(--scale, 1));
      }
      [data-theme-type="playful"] .bookmark:hover {
        transform: translate3d(-2px, -2px, 0) rotate(var(--tilt, 0deg)) scale(var(--scale, 1));
      }

      /* Dark hover: glow */
      [data-theme-type="dark"] .bookmark:hover,
      [data-theme-type="mixed"] .bookmark:hover {
        filter: brightness(1.1);
      }
      [data-theme-type="dark"] .shuffle:hover {
        filter: brightness(1.2);
      }
    }

    /* ===== Height-responsive ===== */

    /* Tier 1: moderate compression for 1080p and below */
    @media (max-height: 1080px) and (min-width: 821px) {
      .bm-content-layer {
        padding: clamp(10px, 1.2vw, 20px) clamp(10px, 1.2vw, 20px) clamp(14px, 1.5vw, 26px);
      }
      .l-classic .bm-content-layer {
        padding: clamp(10px, 1.2vw, 20px) clamp(10px, 1.2vw, 20px) clamp(14px, 1.5vw, 26px);
      }
      .bookmark[data-size="hero"] .title:not(.l-poster .title, .l-index .title) {
        -webkit-line-clamp: 2;
      }
      .board {
        gap: clamp(6px, min(0.9vw, 0.9vh), 12px);
      }
    }

    /* Tier 2: strong compression for 900p and below */
    @media (max-height: 900px) and (min-width: 821px) {
      .page {
        gap: clamp(10px, 1.8vh, 20px);
        padding-top: max(18px, env(safe-area-inset-top));
        padding-bottom: max(14px, env(safe-area-inset-bottom));
      }
      .masthead { margin-bottom: -4px; }
      .brand-name { font-size: clamp(22px, 2.6vw, 36px); }
      .footline { min-height: 32px; }

      .bm-content-layer,
      .l-classic .bm-content-layer {
        padding: 8px clamp(8px, 1vw, 16px) 12px;
      }
      .l-heavy-header .header { padding: 12px 16px; }
      .l-heavy-header .mid { padding: 16px; }
      .l-heavy-header .bottom { padding: 10px 16px; }
      .l-magazine .bottom-half { padding: 12px; }
      .l-brutalist .bm-content-layer { padding: 12px; gap: 8px; }
      .l-bento .bm-content-layer { padding: 10px; gap: 6px; }
      .l-bento .cell { padding: 8px; }
      .l-poster .bm-content-layer { padding: 16px; }
      .l-badge .bm-content-layer { padding: 20px 16px; }
      .l-terminal .bm-content-layer { padding: 12px; }
      .l-terminal .title { margin-bottom: 12px; }
      .l-index .bm-content-layer { padding: 12px 16px; }
      .l-diagonal .top-poly { padding: 14px; }
      .l-diagonal .bottom-poly { padding: 14px; }

      .bookmark[data-size="hero"] .title:not(.l-poster .title, .l-index .title) {
        font-size: clamp(28px, 4.5vw, 64px);
        -webkit-line-clamp: 2;
        line-height: 1.1;
      }
      .bookmark[data-size="wide"] .title {
        font-size: clamp(20px, 2.6vw, 40px);
        line-height: 1.15;
      }
      .bookmark[data-size="tall"] .title {
        font-size: clamp(18px, 2.2vw, 36px);
        line-height: 1.15;
      }
      .bookmark[data-size="small"] .title {
        font-size: clamp(12px, 1.4vw, 20px);
        -webkit-line-clamp: 3;
      }
      .bookmark[data-size="strip"] .title {
        font-size: clamp(12px, 1.6vw, 24px);
        -webkit-line-clamp: 2;
      }
      .title { font-size: 20px; }
      .l-poster .title { font-size: clamp(28px, 4.5vw, 48px); }
      .l-index .title { font-size: clamp(24px, 3vw, 34px); }
      .l-terminal .title { font-size: clamp(12px, 1.6vw, 16px); }

      .l-badge .domain { margin-top: 8px !important; }
      .l-badge .badge { width: 36px; height: 36px; font-size: 14px; }

      .board { gap: clamp(4px, min(0.8vw, 0.8vh), 10px); }
    }

    /* Tier 3: maximum compression for 768p and below */
    @media (max-height: 768px) and (min-width: 821px) {
      .page {
        gap: 8px;
        padding: max(12px, env(safe-area-inset-top)) 16px max(8px, env(safe-area-inset-bottom)) 16px;
      }
      .masthead { margin-bottom: -6px; }
      .brand-name { font-size: 20px; }
      .edition { font-size: 8px; }
      .footline { min-height: 24px; }
      .hint { display: none; }
      .board { gap: 4px; }

      .bm-content-layer,
      .l-classic .bm-content-layer {
        padding: 6px 8px 8px;
      }
      .l-heavy-header .header { padding: 8px 12px; }
      .l-heavy-header .header .folder { font-size: 10px; }
      .l-heavy-header .mid { padding: 8px 12px; }
      .l-heavy-header .bottom { padding: 6px 12px; }
      .l-magazine .bottom-half { padding: 8px; }
      .l-brutalist .bm-content-layer { padding: 8px; gap: 4px; }
      .l-bento .bm-content-layer { padding: 6px; gap: 4px; }
      .l-bento .cell { padding: 6px; }
      .l-poster .bm-content-layer { padding: 10px; }
      .l-badge .bm-content-layer { padding: 14px 10px; }
      .l-badge .badge { width: 28px; height: 28px; font-size: 11px; top: 8px; right: 8px; }
      .l-terminal .bm-content-layer { padding: 8px; }
      .l-terminal .title { margin-bottom: 6px; }
      .l-index .bm-content-layer { padding: 8px 10px; }
      .l-diagonal .top-poly { padding: 10px; }
      .l-diagonal .bottom-poly { padding: 10px; }

      .bookmark[data-size="hero"] .title:not(.l-poster .title, .l-index .title) {
        font-size: clamp(22px, 3.5vw, 48px);
        -webkit-line-clamp: 2;
        line-height: 1.08;
      }
      .bookmark[data-size="wide"] .title {
        font-size: clamp(16px, 2vw, 32px);
        line-height: 1.1;
      }
      .bookmark[data-size="tall"] .title {
        font-size: clamp(15px, 1.8vw, 28px);
        line-height: 1.1;
      }
      .bookmark[data-size="small"] .title {
        font-size: clamp(11px, 1.2vw, 17px);
        -webkit-line-clamp: 3;
        line-height: 1.2;
      }
      .bookmark[data-size="strip"] .title {
        font-size: clamp(11px, 1.4vw, 20px);
        -webkit-line-clamp: 2;
        line-height: 1.1;
      }
      .title { font-size: 16px; }
      .folder, .domain, .number { font-size: 8px !important; }

      .l-poster .title { font-size: clamp(20px, 3.5vw, 36px); }
      .l-index .title { font-size: clamp(18px, 2.5vw, 28px); }
      .l-terminal .title { font-size: clamp(11px, 1.4vw, 14px); }

      .l-badge .domain { margin-top: 4px !important; }

      .l-magazine .top-half { height: 35%; }
      .l-magazine .bottom-half { height: 65%; }
      .bookmark[data-size="small"] .l-magazine .top-half,
      .bookmark[data-size="strip"] .l-magazine .top-half { height: 25%; }
      .bookmark[data-size="small"] .l-magazine .bottom-half,
      .bookmark[data-size="strip"] .l-magazine .bottom-half { height: 75%; }

      .l-diagonal .top-poly { height: 35%; }
      .l-diagonal .bottom-poly { height: 55%; }
    }

    /* ===== Responsive ===== */
    @media (max-width: 820px) {
      body { overflow: auto; }

      .page {
        min-height: 100vh;
        height: auto;
        padding: 22px 16px 18px;
      }

      .masthead {
        align-items: flex-start;
      }

      .brand-name {
        font-size: 34px;
      }

      .edition {
        font-size: 9px;
      }

      .board {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: none;
        gap: 10px;
      }

      .board .bookmark {
        grid-column: 1 / -1;
        grid-row: auto;
        min-height: 178px;
        transform: translateY(14px) rotate(0deg);
      }

      .bookmark[data-size="hero"],
      .bookmark[data-size="wide"],
      .bookmark[data-size="tall"],
      .bookmark[data-size="small"],
      .bookmark[data-size="strip"] {
        min-height: 178px;
      }

      .bookmark[data-size="hero"] .title,
      .bookmark[data-size="wide"] .title,
      .bookmark[data-size="tall"] .title,
      .bookmark[data-size="small"] .title,
      .bookmark[data-size="strip"] .title {
        font-size: clamp(28px, 11vw, 46px);
        line-height: 0.96;
        letter-spacing: -0.044em;
        -webkit-line-clamp: 3;
      }

      .footline {
        padding-top: 4px;
      }
    }

    @media (max-width: 520px) {
      .masthead {
        gap: 10px;
      }

      .brand {
        gap: 9px;
      }

      .brand-mark {
        width: 20px;
        height: 20px;
      }

      .brand-name {
        font-size: 30px;
      }

      .edition .edition-date {
        display: none;
      }

      .hint {
        display: none;
      }

      .footline {
        justify-content: flex-end;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }

    /* ===== Fonts blocked fallback ===== */
    body.fonts-blocked .bm-content-layer {
      padding-top: 6px;
      padding-bottom: 8px;
    }
    body.fonts-blocked .title {
      line-height: 1.2;
      padding: 0;
    }

    /* ===== Keyframes ===== */
    @keyframes fadeLift {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform:
          translate3d(var(--drift-x, 0), 14px, 0)
          rotate(var(--tilt, 0deg))
          scale(var(--scale, 1));
      }
      to {
        opacity: 1;
        transform:
          translate3d(0, 0, 0)
          rotate(var(--tilt, 0deg))
          scale(var(--scale, 1));
      }
    }

    @keyframes cardDeal {
      0% {
        opacity: 0;
        transform:
          translate3d(var(--deal-x, 0), var(--deal-y, 16px), 0)
          rotate(var(--deal-tilt, 0deg))
          scale(0.985);
        filter: blur(3px);
      }
      100% {
        opacity: 1;
        transform:
          translate3d(0, 0, 0)
          rotate(var(--tilt, 0deg))
          scale(var(--scale, 1));
        filter: blur(0);
      }
    }

    /* SOFT KEYFRAMES */
    @keyframes softFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    }
    @keyframes softSpin {
      0% { transform: rotate(0) scale(1); }
      50% { transform: rotate(180deg) scale(0.9); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes softFade {
      0%, 100% { opacity: 1; transform: translateY(0); }
      50% { opacity: 0; transform: translateY(-2px); }
    }

  </style>
</head>
<body>
  <div class="ambient-glow" id="ambientGlow"></div>
  <main class="page">
    <header class="masthead" aria-label="Wander">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path fill="currentColor" d="M14 8h36v48L32 45 14 56V8Z"/>
          <path fill="var(--canvas)" d="M22 16h18v6H22zM22 28h11v6H22z"/>
        </svg>
        <div class="brand-name">Wander</div>
      </div>
      <div class="edition" aria-live="polite">
        <span class="edition-date" id="headerDate"></span>
        <span id="headerCount"></span>
      </div>
    </header>

    <section class="board" id="cardsGrid" aria-label="Random bookmarks"></section>

    <footer class="footline" id="footer" style="display:none">
      <div class="hint">Six saved places, loosely arranged</div>
      <button class="shuffle" id="shuffleBtn" type="button" aria-label="Shuffle bookmarks">
        <svg class="shuffle-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="sh-path-1" d="M3 5h3.2c2.8 0 3.8 10 7.1 10H17"/>
          <path class="sh-arrow-top" d="M14.2 2.8 17 5l-2.8 2.2"/>
          <path class="sh-path-3" d="M3 15h3.1c1 0 1.8-.8 2.5-2"/>
          <path class="sh-path-4" d="M12.5 7.2c.3-1.2 1-2.2 2.2-2.2H17"/>
          <path class="sh-arrow-bot" d="M14.2 12.8 17 15l-2.8 2.2"/>
        </svg>
        <div class="shuffle-text">
          <span style="--i:1">S</span><span style="--i:2">h</span><span style="--i:3">u</span><span style="--i:4">f</span><span style="--i:5">f</span><span style="--i:6">l</span><span style="--i:7">e</span>
        </div>
      </button>
    </footer>
  </main>
  <script src="themes.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
